name: iOS IPA Derle
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen kur
        run: brew install xcodegen
      - name: Proje oluştur
        run: xcodegen generate
      - name: Derle
        run: |
          set -o pipefail
          xcodebuild -project IPTVPlayer.xcodeproj -scheme IPTVPlayer -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPTVPlayer.app Payload/
          zip -qr IPTVPlayer.ipa Payload
      - name: Hataları göster
        if: failure()
        run: |
          echo '### Derleme hataları' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|\*\* BUILD FAILED" -A2 build.log | head -60 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:" build.log | head -10 | while read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-ipa
          path: IPTVPlayer.ipa
